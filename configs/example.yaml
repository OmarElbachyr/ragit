# Reference representation of ragit.experiment.ExperimentConfig.
# RAGit currently constructs this configuration through the Python API.
parsing:
  parser_name: pymupdf4llm
  output_format: text
  options:
    use_ocr: true

chunking:
  chunker_name: token
  options:
    tokenizer: character
    chunk_size: 512

indexing:
  index_type: dense
  model_name: BAAI/bge-m3
  options:
    batch_size: 16

retrieval:
  top_k: 10
  aggregation: max

evaluation:
  metrics:
    - nDCG
    - Recall
    - Success
    - RR
  k:
    - 1
    - 5
    - 10
