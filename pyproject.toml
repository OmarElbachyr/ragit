[project]
name = "ragit"
version = "0.1.0.dev0"
description = "Compare document parsing and chunking configurations with page-level retrieval evaluation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
  "chonkie[neural,semantic,st]==1.7.0",
  "faiss-cpu==1.15.0",
  "ir-measures==0.4.3",
  "tabulate==0.10.0",
  "pydantic==2.13.4",
  "pymupdf==1.28.0",
  "pypdf==6.14.2",
  "pymupdf4llm==1.28.0",
  "pyyaml==6.0.3",
  "pillow==10.4.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "fast-plaid==1.4.6.2110",
  "sentence-transformers==6.0.1",
  "transformers==5.8.0",
]

[project.optional-dependencies]
docling = [
  "docling==2.118.0",
  "easyocr==1.7.2",
]

unstructured = [
  "unstructured[pdf]",
]

marker = [
  "marker-pdf==1.10.2",
  "vllm==0.20.2"
]

docs = [
  "mkdocs",
]

dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

all = [
  "docling==2.118.0",
  "easyocr==1.7.2",
  "unstructured[pdf]",
  "marker-pdf==1.10.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragit"]
